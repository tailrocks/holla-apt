[tools]
actionlint = "1.7.12"
gh = "2.96.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[bootstrap.packages]
"apt:reprepro" = "latest"
"apt:gnupg" = "latest"

[tasks.actionlint]
run = "actionlint"

[tasks.shellcheck]
run = "shellcheck scripts/*.sh"

[tasks.package-update]
run = "./scripts/package-update.sh"

[tasks.package-update-test]
run = "./scripts/test-package-update.sh"

[tasks.check]
depends = ["actionlint", "shellcheck", "package-update-test"]

[settings]
lockfile = true
