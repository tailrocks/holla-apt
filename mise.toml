[tools]
actionlint = "1.7.12"
gh = "2.98.0"
jq = "1.8.2"
shellcheck = "0.11.0"
ripgrep = "15.2.0"

[bootstrap.packages]
"apt:reprepro" = "latest"
"apt:gnupg" = "latest"

[tasks.actionlint]
run = "actionlint"

[tasks.shellcheck]
run = "shellcheck scripts/*.sh"

[tasks.package-update]
run = "./scripts/package-update.sh"

[tasks.package-update-test]
run = "./scripts/test-package-update.sh"

[tasks.check]
depends = ["actionlint", "shellcheck", "package-update-test"]

# The shared Velnor apt workflow invokes this fleet contract before its
# disjoint leaf gates. Keep the alias real and rooted in the repository's
# complete offline check instead of leaving a stale command reference.
[tasks."fleet:check"]
description = "Run the complete apt repository contract"
depends = ["check"]

# Build gate: truthful no-op. This repository ships verified upstream
# debs; no offline build leaf exists. Nothing in CI invokes this task
# (docs unit has empty commands); it exists so `mise run build` stays
# total for humans and fleet tooling.
[tasks.build]
run = "true"

[tasks.test]
depends = ["package-update-test"]

[tasks.lint]
depends = ["actionlint", "shellcheck"]

# Format gate: truthful no-op. No formatter is pinned for this class.
[tasks.fmt]
run = "true"

[settings]
lockfile = true
