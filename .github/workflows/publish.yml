name: Publish apt repo

# Adds holla .deb(s) to the signed apt pool and publishes the tree to
# GitHub Pages (gh-pages branch). Trigger after a holla release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "holla release tag to publish (e.g. v0.2.0). Empty = latest."
        type: string
        default: ""
  # Allow the main holla repo to trigger this (see release-deb.yml, same as velnor):
  #   gh workflow run publish.yml --repo tailrocks/holla-apt -f version=v0.2.0
  #
  # Or via repository_dispatch:
  #   gh api repos/tailrocks/holla-apt/dispatches \
  #     -f event_type=publish-deb \
  #     -F client_payload[version]=v0.2.0
  repository_dispatch:
    types: [publish-deb]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo config (conf/distributions, keep apt state on gh-pages branch for reprepro history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set — see README one-time setup (store values securely, then copy to GitHub secrets)."
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the public key into the tree so users can fetch holla.gpg.
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --armor --export "$KEYID" > holla.gpg
          # Prime gpg for headless signing (loopback + supplied passphrase).
          # Prevents "Inappropriate ioctl for device / Pinentry" errors from gpgme/reprepro in CI.
          echo "$APT_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --sign --local-user "$KEYID" --output /dev/null --detach-sign <(echo "prime signing for reprepro") 2>/dev/null || true

      - name: Download holla .deb from this repo's release (best-effort; key publish works with zero debs)
        # The holla repo's release workflow uploads the .deb(s) to THIS repo's
        # releases (cross-repo write with a PAT), so publishing here only needs
        # the same-repo github.token.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}${{ github.event.client_payload.version }}
        run: |
          set +e
          mkdir -p incoming
          if [ -n "${VERSION:-}" ]; then
            TAG="$VERSION"
          else
            TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          fi
          if [ -n "${TAG:-}" ]; then
            echo "Downloading debs for $TAG (if present)"
            gh release download "$TAG" --pattern '*.deb' --dir incoming || echo "No matching debs for $TAG"
          else
            echo "No release tag available on this repo; publishing current tree + fresh .gpg only"
          fi
          ls -la incoming || true
          set -euo pipefail

      - name: Fetch existing apt tree from gh-pages branch (so reprepro keeps old versions)
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          mkdir -p public
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git --work-tree=public checkout origin/gh-pages -- . || true
          fi
          mkdir -p public/conf
          # Inject the real key id into conf/distributions for SignWith.
          sed "s/^# SignWith:.*/SignWith: ${GPG_KEYID}/; s/^SignWith:.*/SignWith: ${GPG_KEYID}/" conf/distributions > public/conf/distributions
          cp holla.gpg public/holla.gpg

      - name: reprepro includedeb (builds + signs Release/InRelease)
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Safe glob handling when there are zero .debs (first publish / key-only refresh).
          # We still want to publish the .gpg + any pre-existing tree from gh-pages state.
          shopt -s nullglob
          debs=(incoming/*.deb)
          if [ ${#debs[@]} -gt 0 ]; then
            for deb in "${debs[@]}"; do
              reprepro -b public --gnupghome "$HOME/.gnupg" includedeb stable "$deb"
            done
          else
            echo "No .debs in incoming/; publishing key + existing tree only."
          fi
          ls -R public/dists public/pool 2>/dev/null | head -50 || true

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

      - name: Update gh-pages branch (state only, for reprepro history across publishes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace branch contents with the built public/ tree
          git checkout --orphan gh-pages-new || true
          git rm -rf . || true
          cp -a public/. .
          git add .
          git commit -m "Update for $TAG" || echo "No changes"
          git branch -M gh-pages
          git push origin gh-pages --force || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
