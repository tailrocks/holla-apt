name: Publish apt repo

# Adds holla .deb(s) to the signed apt pool and publishes the tree to
# GitHub Pages (gh-pages branch). Trigger after a holla release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "holla release tag to publish (e.g. v0.2.0). Empty = latest."
        type: string
        default: ""
  # Allow the main holla repo to trigger this (see release-deb.yml, same as velnor):
  #   gh workflow run publish.yml --repo tailrocks/holla-apt -f version=v0.2.0
  #
  # Or via repository_dispatch:
  #   gh api repos/tailrocks/holla-apt/dispatches \
  #     -f event_type=publish-deb \
  #     -F client_payload[version]=v0.2.0
  repository_dispatch:
    types: [publish-deb]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo config (conf/distributions, keep apt state on gh-pages branch for reprepro history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set — see README one-time setup (store values in 1Password first, then copy to GitHub secrets)."
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the public key into the tree so users can fetch holla.gpg.
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --armor --export "$KEYID" > holla.gpg

      - name: Download holla .deb from this repo's release
        # The holla repo's release workflow uploads the .deb(s) to THIS repo's
        # releases (cross-repo write with a PAT), so publishing here only needs
        # the same-repo github.token.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [ -n "${VERSION:-}" ]; then TAG="$VERSION"; else TAG="$(gh release view --json tagName -q .tagName)"; fi
          echo "Publishing $TAG"
          gh release download "$TAG" --pattern '*.deb' --dir incoming
          ls -la incoming

      - name: Fetch existing apt tree from gh-pages branch (so reprepro keeps old versions)
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          mkdir -p public
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git --work-tree=public checkout origin/gh-pages -- . || true
          fi
          mkdir -p public/conf
          # Inject the real key id into conf/distributions for SignWith.
          sed "s/^# SignWith:.*/SignWith: ${GPG_KEYID}/; s/^SignWith:.*/SignWith: ${GPG_KEYID}/" conf/distributions > public/conf/distributions
          cp holla.gpg public/holla.gpg

      - name: reprepro includedeb (builds + signs Release/InRelease)
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for deb in incoming/*.deb; do
            reprepro -b public --gnupghome "$HOME/.gnupg" includedeb stable "$deb"
          done
          ls -R public/dists public/pool | head -50

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

      - name: Update gh-pages branch (state only, for reprepro history across publishes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace branch contents with the built public/ tree
          git checkout --orphan gh-pages-new || true
          git rm -rf . || true
          cp -a public/. .
          git add .
          git commit -m "Update for $TAG" || echo "No changes"
          git branch -M gh-pages
          git push origin gh-pages --force || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
