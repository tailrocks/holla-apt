name: Publish apt repo

# Adds holla .deb(s) to the signed apt pool and publishes the tree to
# GitHub Pages via GitHub Actions. Only current versions are published
# in the index (old .debs remain in historical Releases but are not
# part of the current apt repo). Trigger after a holla release.
on:
  push:
    branches: [main]
    paths: [package-state.json]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  attestations: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build apt repository (${{ matrix.config.lane }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    steps:
      - name: Checkout repo config (conf/distributions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system packages through mise
        run: mise bootstrap packages apply --yes

      - name: Download and verify merged package state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '
            keys == ["packages","schema","source_commit","source_ref","source_repository","version"] and
            .schema == "holla.apt-package-state.v1" and
            .source_repository == "tailrocks/holla" and
            (.source_ref | test("^refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$")) and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            (.packages | length) == 2
          ' package-state.json >/dev/null
          tag=$(jq -r .source_ref package-state.json)
          tag=${tag#refs/tags/}
          commit=$(gh api "repos/tailrocks/holla/commits/$tag" --jq .sha)
          test "$commit" = "$(jq -r .source_commit package-state.json)"
          mkdir -m 0700 incoming
          gh release download "$tag" -R tailrocks/holla -p release-manifest.json -p SHA256SUMS -D incoming
          while IFS= read -r name; do
            [[ "$name" != */* && "$name" != *..* ]]
            gh release download "$tag" -R tailrocks/holla -p "$name" -D incoming
          done < <(jq -r '.packages[].name' package-state.json)
          jq -e --slurpfile state package-state.json '
            .schema == "velnor.package-release.v1" and
            .source_repository == $state[0].source_repository and
            .source_ref == $state[0].source_ref and
            .source_commit == $state[0].source_commit and
            .version == $state[0].version and
            ([.assets[] | select(.name | endswith(".deb")) | {name,sha256}] | sort_by(.name)) == $state[0].packages
          ' incoming/release-manifest.json >/dev/null
          while IFS=$'\t' read -r name digest; do
            manifest_digest=$(awk -v name="$name" '$2==name || $2=="*"name {print $1}' incoming/SHA256SUMS)
            test "$digest" = "$manifest_digest"
            printf '%s  %s\n' "$digest" "incoming/$name"
          done < <(jq -r '.packages[] | [.name,.sha256] | @tsv' package-state.json) \
            > incoming/consumer-SHA256SUMS
          sha256sum --check --strict incoming/consumer-SHA256SUMS
          while IFS= read -r name; do
            gh attestation verify "incoming/$name" \
              --repo tailrocks/holla \
              --source-ref "$(jq -r .source_ref package-state.json)" \
              --source-digest "$(jq -r .source_commit package-state.json)" \
              --signer-workflow tailrocks/velnor-actions/.github/workflows/package-signer.yml \
              --signer-digest 643c5341b160be151a7fae19b89b6a4f8ab3b275 \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners >/dev/null
          done < <(jq -r '.packages[].name' package-state.json)

          for tuple in 'x86_64-unknown-linux-gnu amd64' 'aarch64-unknown-linux-gnu arm64'; do
            read -r target arch <<<"$tuple"
            deb="incoming/holla-$(jq -r .version package-state.json)-$target.deb"
            test "$(dpkg-deb -f "$deb" Package)" = holla
            test "$(dpkg-deb -f "$deb" Version)" = "$(jq -r .version package-state.json)"
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
          done

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set — see README one-time setup (store values securely, then copy to GitHub secrets)."
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the public key into the tree so users can fetch holla.gpg.
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"
          # Export the public key as a BINARY (dearmored) keyring, not
          # ASCII-armored: the workload installs this verbatim into
          # /etc/apt/keyrings/holla.gpg with `signed-by=`, and apt resolves
          # the signing SUBKEY (8A45…, under primary E5BC…) reliably only
          # from a binary keyring — an armored .gpg gave apt NO_PUBKEY.
          # Export all keys so whichever (sub)key signs is present.
          gpg --export > holla.gpg
          # Prime gpg for headless signing (loopback + supplied passphrase).
          # Prevents "Inappropriate ioctl for device / Pinentry" errors from gpgme/reprepro in CI.
          echo "$APT_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --sign --local-user "$KEYID" --output /dev/null --detach-sign <(echo "prime signing for reprepro") 2>/dev/null || true

      - name: Build fresh apt repository with reprepro (current versions only)
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Fresh each time: only the .debs being published now. Old versions are forgotten from the index (remain in old Releases for manual dpkg -i if ever needed).
          rm -rf public
          mkdir -p public/conf
          cat > public/conf/distributions << 'DIST'
          Origin: Holla
          Label: Holla
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: apt repository for holla — adaptive dev environment CLI
          SignWith:
          DIST
          sed -i "s/^SignWith:.*/SignWith: ${GPG_KEYID}/" public/conf/distributions
          cp holla.gpg public/holla.gpg

          for deb in incoming/*.deb; do
            if [ -f "$deb" ]; then
              reprepro -b public --gnupghome "$HOME/.gnupg" includedeb stable "$deb"
            fi
          done
          find public/dists public/pool -print | sort | sed -n '1,50p'

      - name: Setup Pages
        if: matrix.config.writer
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: matrix.config.writer
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

      # No state branch update step. The Releases are the source of truth for .debs.
      # The index on Pages is always for currently published versions only.

  deploy:
    name: Deploy apt repository (${{ matrix.config.lane }})
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        if: matrix.config.writer
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Explain read-only comparison lane
        if: ${{ !matrix.config.writer }}
        run: echo 'Read-only comparison lane; Pages deployment skipped.'

  publish-required:
    needs: [build, deploy]
    if: always()
    name: Publish required (${{ matrix.config.lane }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    steps:
      - name: Fail on any failed or cancelled need
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled") | not' >/dev/null \
            || { echo "A required job failed or was cancelled." >&2; exit 1; }
